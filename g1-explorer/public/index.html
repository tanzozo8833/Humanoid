<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G1 Explorer</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- The robot is the page background (app.js). Everything else floats over it. -->
  <div class="stage" id="stage">
    <div class="loading" id="loading">
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <span id="loading-text">Đang tải mô hình 3D…</span>
    </div>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="labels3d" id="labels3d"></div>

  <header class="topbar">
    <div class="brand">
      <b>Unitree G1</b><span>Cấu tạo · 29 DoF + 2 × Dex3-1 (43 DoF)</span>
    </div>
    <div class="toolbar">
      <label title="Làm vỏ trong suốt và hiện motor, pin, board, cảm biến, dây bên trong">
        <input type="checkbox" id="opt-xray" /> Nhìn xuyên (X-ray)</label>
      <label title="Tách các khâu ra theo chuỗi động học"><span>Tách rời</span>
        <input type="range" id="opt-explode" min="0" max="100" value="0" /></label>
      <label><span>Tư thế</span>
        <select id="opt-pose">
          <option value="stand">Đứng</option>
          <option value="zero">Zero (URDF, q = 0)</option>
          <option value="wave">Vẫy tay</option>
          <option value="squat">Ngồi xổm</option>
          <option value="grasp">Nắm bàn tay</option>
          <option value="walk">Bước đi (minh hoạ)</option>
        </select></label>
      <label title="5 URDF chính thức của Unitree"><span>Phiên bản</span>
        <select id="opt-hand">
          <option value="dex3">G1 EDU + Dex3-1 (3 ngón)</option>
          <option value="inspire">G1 EDU + Inspire (5 ngón)</option>
          <option value="dex1">G1 EDU + tay kẹp Dex1-1</option>
          <option value="g1_23">G1 bản thường 23 DoF</option>
          <option value="g1plus">G1+ (2026) có cổ</option>
        </select></label>
      <details class="layers">
        <summary class="btn">Lớp xem ▾</summary>
        <div class="layers-menu">
          <label><input type="checkbox" data-layer="axes" /> Trục khớp + tầm quay</label>
          <label><input type="checkbox" data-layer="com" /> Trọng tâm + vùng chân đỡ</label>
          <label><input type="checkbox" data-layer="material" /> Vật liệu</label>
          <label><input type="checkbox" data-layer="fov" /> Vùng nhìn camera / LiDAR</label>
          <label><input type="checkbox" data-layer="dims" /> Kích thước đo trên mô hình</label>
          <label><input type="checkbox" data-layer="reach" /> Vùng với tới của tay</label>
        </div>
      </details>
      <label><input type="checkbox" id="opt-labels" checked /> Nhãn</label>
      <label><input type="checkbox" id="opt-spin" /> Tự xoay</label>
      <button type="button" class="btn" id="opt-reset">Đặt lại góc nhìn</button>
    </div>
  </header>

  <aside class="side" id="side">
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="parts">Bộ phận</button>
      <button type="button" class="tab" data-tab="joints">Bảng khớp</button>
      <button type="button" class="tab" data-tab="system">Hệ thống</button>
      <button type="button" class="tab" data-tab="functions">Chức năng</button>
    </nav>
    <div class="side-body" id="side-body"></div>
  </aside>

  <div class="legend" id="legend" hidden></div>
  <div class="legend legend-right" id="mat-legend" hidden></div>
  <p class="hint" id="hint">Click một bộ phận để xem cấu tạo · Double-click để mở bên trong · Kéo để xoay · Cuộn để zoom</p>

  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.min.js" } }
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
